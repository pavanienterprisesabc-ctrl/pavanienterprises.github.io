<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Pavani Enterprises</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">

  <style>
    .password-wrapper{position:relative}
    .toggle-eye{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      cursor:pointer;font-size:13px;color:#2563eb
    }

    /* Modal */
    .modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:9999}
    .modal{background:#fff;padding:22px;border-radius:10px;max-width:420px;width:90%;text-align:center;box-sizing:border-box}
    #modalText{word-wrap:break-word;overflow-wrap:break-word;white-space:normal;line-height:1.5;font-size:14px}
    .modal button{padding:10px 16px;margin-top:14px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
  </style>
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-card">
    <div class="auth-image">
      <img src="images/welcome back.png" alt="Welcome back">
    </div>

    <div class="auth-tabs">
      <a href="signup.html">Sign Up</a>
      <span class="active">Login</span>
    </div>

    <form class="auth-form" id="loginForm">

      <!-- GOOGLE LOGIN -->
      <button type="button" id="googleLogin" class="google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png"
             alt="Google"
             style="width:18px; margin-right:10px; vertical-align:middle;">
        Continue with Google
      </button>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter email" required>

      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required>
        <span class="toggle-eye" onclick="togglePassword()">Show</span>
      </div>

      <button type="submit">Login</button>

      <a href="forgot-password.html" class="forgot">Forgot password?</a>

      <p class="switch-text">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>
    </form>
  </div>

</div>

<!-- POPUP -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div id="modalText"></div>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<!-- 🔥 FIREBASE v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyBD9ml42x0fesLcf3fReCoureRJEsf5E5Q",
    authDomain: "pavani-auth.firebaseapp.com",
    projectId: "pavani-auth",
    appId: "1:432020373990:web:462a69f39757a1a325d627"
  });

  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  function showModal(msg){
    document.getElementById("modalText").textContent = msg;
    document.getElementById("modalBg").style.display = "flex";
  }

  function closeModal(){
    document.getElementById("modalBg").style.display = "none";
  }

  function togglePassword(){
    const input = document.getElementById("password");
    const eye = document.querySelector(".toggle-eye");
    input.type = input.type === "password" ? "text" : "password";
    eye.textContent = input.type === "password" ? "Show" : "Hide";
  }

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      showModal("Please fill in all the fields.");
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .then((cred) => {
        if (!cred.user.emailVerified) {
          showModal("Please verify your email before logging in.");
          auth.signOut();
          return;
        }
        window.location.href = "index.html";
      })
      .catch((error) => {
        if (error.code === "auth/user-not-found") {
          showModal("This email is not registered. Please sign up first.");
        } else {
          showModal(error.message);
        }
      });
  });

  document.getElementById("googleLogin").addEventListener("click", () => {
    auth.signInWithPopup(provider)
      .then((result) => {
        if (result.additionalUserInfo.isNewUser) {
          showModal("This email is not registered. Please sign up first.");
          auth.currentUser.delete();
          auth.signOut();
          return;
        }
        window.location.href = "index.html";
      })
      .catch((error) => {
        showModal(error.message);
      });
  });
</script>

</body>
</html>

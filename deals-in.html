<!DOCTYPE html>

<style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: -1;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 10px;
      color: #ffd369;
      letter-spacing: 1px;
    }

    .company-name {
      text-align: center;
      font-size: 18px;
      margin-bottom: 25px;
      color: #ffffff;
      font-weight: 500;
    }

    .back-btn {
      margin-bottom: 20px;
    }

    .back-btn button {
      background: linear-gradient(135deg, #ffd369, #ff9f1c);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: 0.3s ease;
    }

    .back-btn button:hover {
      transform: translateY(-2px);
    }

    /* LANGUAGE SELECTOR */

    .language-select {
      text-align: center;
      margin-bottom: 35px;
      width: 100%;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .language-select select {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      width: 100%;
      box-sizing: border-box;
      min-height: 48px;
      -webkit-appearance: none;
      appearance: none;
    }

    .language-select select:hover {
      border: 1px solid #ffd369;
      box-shadow: 0 8px 25px rgba(255,211,105,0.3);
      transform: translateY(-2px);
    }

    .language-select select:focus {
      border: 1px solid #ffd369;
      box-shadow: 0 0 12px rgba(255,211,105,0.6);
    }

    .language-select option {
      background: #1e1e1e;
      color: #ffffff;
    }

    /* Search box */

    .language-search {
      margin-bottom: 18px;
      width: 100%;
    }

    .language-search input {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 12px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .language-search input::placeholder {
      color: #dddddd;
    }

    .language-search input:focus {
      border: 1px solid #ffd369;
      box-shadow: 0 0 10px rgba(255,211,105,0.6);
    }

    /* PRODUCTS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
      transition: 0.3s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      word-break: break-word;
    }

    .product-card:hover {
      transform: translateY(-8px);
    }

    .product-card img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
      cursor: pointer;
      background: #ffffff10;
      padding: 10px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    /* ================= MOBILE IMPROVEMENTS ================= */

    @media (max-width: 600px) {

      .container {
        padding: 30px 16px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 6px;
      }

      .company-name {
        font-size: 14px;
        margin-bottom: 20px;
      }

      .back-btn button {
        padding: 8px 14px;
        font-size: 14px;
      }

      .products-grid {
        gap: 20px;
      }

      .product-card {
        padding: 16px;
      }

      .product-name {
        font-size: 15px;
      }
    }

/* IMAGE PREVIEW MODAL */

/* image inside modal */

/* BACK BUTTON ON TOP */

  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  z-index: 10000;
}

.preview-back:hover {

}

<script>
  function openPreview(src) {
  const modal = document.getElementById("imageModal");
  document.getElementById("previewImg").src = src;
  modal.classList.add("active");
}

function closePreview() {
  const modal = document.getElementById("imageModal");
  modal.classList.remove("active");
}

  function decodeHtml(html) {
    var txt = document.createElement("textarea");
    txt.innerHTML = html;
    return txt.value;
  }

  async function translatePage(lang) {
    if (lang === "en") {
      location.reload();
      return;
    }

    const productNames = Array.from(document.querySelectorAll(".product-name"));
    const promises = productNames.map(async el => {
      const originalText = el.getAttribute("data-original") || el.innerText;
      el.setAttribute("data-original", originalText);

      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(originalText)}&langpair=en|${lang}`);
        const data = await res.json();
        const translated = decodeHtml(data.responseData.translatedText || originalText);
        el.innerText = translated;
      } catch {
        el.innerText = originalText; // fallback if translation fails
      }
    });

    await Promise.all(promises);
  }

document.addEventListener("DOMContentLoaded", function () {

  const select = document.getElementById("languageDropdown");
  const searchInput = document.getElementById("languageSearch");
  const options = Array.from(select.options);

  // 🔠 Alphabetical Sort
  options.sort((a, b) => a.text.localeCompare(b.text));
  select.innerHTML = "";
  options.forEach(option => select.add(option));

 // 🔍 Search Filter + Auto Select
searchInput.addEventListener("keyup", function () {

  const filter = this.value.toLowerCase();
  let firstMatch = null;

  options.forEach(option => {

    if (option.text.toLowerCase().includes(filter)) {
      option.style.display = "";

      if (!firstMatch) {
        firstMatch = option;
      }

    } else {
      option.style.display = "none";
    }
  });

  // 👉 Automatically select first matched language
  if (firstMatch) {
    select.value = firstMatch.value;
    translatePage(firstMatch.value);
  }
});
});

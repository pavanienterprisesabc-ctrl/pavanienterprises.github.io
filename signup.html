<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up | Pavani Enterprises</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">

<style>
.password-wrapper{position:relative}
.password-wrapper input{
  width:100%;
  padding-right:60px;
  box-sizing:border-box;
}

.toggle-eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:13px;
  color:#2563eb;
  user-select:none;
}

.strength{font-size:12px;margin-top:6px}
.weak{color:red}.medium{color:orange}.strong{color:green}
.meter{height:5px;border-radius:4px;background:#e5e7eb;margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;width:0%;transition:.3s}
.google-signup{
  margin-bottom:14px;background:#fff;border:1px solid #ddd;
  padding:10px;border-radius:8px;cursor:pointer;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px
}
#resendBtn{
  margin-top:12px;width:100%;padding:10px;border:none;
  border-radius:8px;cursor:not-allowed;background:#ccc;color:#555;display:none
}

/* Modal Styles */
.modal-bg{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.modal{
  background:#fff;
  padding:20px;
  border-radius:8px;
  max-width:400px;
  width:90%;
  text-align:center;
}
.modal input{
  width:100%;
  padding:8px 60px 8px 8px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

.modal button{
  padding:10px 16px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}
/* Ensure modal toggle-eye is inside modal input */
.modal .password-wrapper{margin:8px 0;position:relative;}
.modal .toggle-eye{right:10px;top:50%;transform:translateY(-50%);font-size:13px;}
</style>
</head>

<body>

<div class="auth-wrapper">
<div class="auth-card">
<div class="auth-image">
<img src="images/businessman.png">
</div>

<div class="auth-tabs">
<span class="active">Sign Up</span>
<a href="login.html">Login</a>
</div>

<form class="auth-form" id="signupForm">

<button type="button" class="google-signup" id="googleSignup">
<img src="https://developers.google.com/identity/images/g-logo.png" width="18">
Continue with Google
</button>

<label>Full Name</label>
<input type="text" id="fullName" required>

<label>Email Address</label>
<input type="email" id="email" required>

<label>Password</label>
<div class="password-wrapper">
<input type="password" id="password" required>
<span class="toggle-eye" onclick="togglePassword('password',this)">Show</span>
</div>
<div class="meter"><span id="meterBar"></span></div>
<div id="strengthText" class="strength"></div>

<label>Confirm Password</label>
<div class="password-wrapper">
<input type="password" id="confirmPassword" required>
<span class="toggle-eye" onclick="togglePassword('confirmPassword',this)">Show</span>
</div>

<button type="submit">Create Account</button>
<button type="button" id="resendBtn">Resend verification (60s)</button>

</form>
</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div id="modalMessage"></div>
    <div class="password-wrapper" style="display:none" id="modalPasswordWrapper">
      <input type="password" id="modalPassword" placeholder="Password">
      <span class="toggle-eye" onclick="togglePassword('modalPassword',this)">Show</span>
    </div>
    <div class="password-wrapper" style="display:none" id="modalConfirmWrapper">
      <input type="password" id="modalConfirm" placeholder="Confirm Password">
      <span class="toggle-eye" onclick="togglePassword('modalConfirm',this)">Show</span>
    </div>
    <div class="meter" style="display:none" id="modalMeter"><span id="modalMeterBar"></span></div>
    <div id="modalStrengthText" class="strength" style="display:none"></div>
    <input type="text" id="modalInput" placeholder="" style="display:none">
    <button id="modalBtn">OK</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBD9ml42x0fesLcf3fReCoureRJEsf5E5Q",
  authDomain:"pavani-auth.firebaseapp.com",
  projectId:"pavani-auth",
  appId:"1:432020373990:web:462a69f39757a1a325d627"
});

const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

let resendCount = 0;
let timer;

/* 👁️ SHOW / HIDE PASSWORD */
function togglePassword(id,e){
  const i=document.getElementById(id);
  i.type=i.type==="password"?"text":"password";
  e.textContent=i.type==="password"?"Show":"Hide";
}

/* 🔐 PASSWORD STRENGTH */
function strengthCheck(p, meter=null, text=null){
  let s=0;
  if(p.length>=8)s++;
  if(/[A-Z]/.test(p))s++;
  if(/\d/.test(p))s++;
  if(/[@$!%*?&]/.test(p))s++;
  if(meter) meter.style.width=[0,"25%","60%","60%","100%"][s];
  if(meter) meter.style.background=s<2?"red":s<4?"orange":"green";
  if(text) {
    text.textContent=s<2?"Weak":s<4?"Medium":"Strong";
    text.className="strength "+(s<2?"weak":s<4?"medium":"strong");
  }
  return s===4;
}

password.oninput=e=>strengthCheck(e.target.value,meterBar,strengthText);

/* ⏱️ RESEND TIMER */
function startTimer(){
  let sec = 59;
  resendBtn.style.display="block";
  resendBtn.disabled=true;
  resendBtn.style.background="#ccc";
  resendBtn.style.color="#555";
  resendBtn.textContent=`Resend verification (${sec}s)`;

  timer=setInterval(()=>{
    sec--;
    resendBtn.textContent=`Resend verification (${sec}s)`;
    if(sec<=0){
      clearInterval(timer);
      if(resendCount<3){
        resendBtn.disabled=false;
        resendBtn.style.background="#2563eb";
        resendBtn.style.color="#fff";
        resendBtn.textContent="Resend verification";
      }
    }
  },1000);
}

/* 🔔 MODAL FUNCTIONS */
function showModal(message,type){
  return new Promise(resolve=>{
    const bg = document.getElementById("modalBg");
    const msg = document.getElementById("modalMessage");
    const input = document.getElementById("modalInput");
    const passWrapper = document.getElementById("modalPasswordWrapper");
    const confirmWrapper = document.getElementById("modalConfirmWrapper");
    const pass = document.getElementById("modalPassword");
    const confirm = document.getElementById("modalConfirm");
    const meter = document.getElementById("modalMeter");
    const meterBar = document.getElementById("modalMeterBar");
    const strengthText = document.getElementById("modalStrengthText");
    const btn = document.getElementById("modalBtn");
btn.textContent = type === "verify" ? "I have completed my verification" : "OK";
    msg.innerHTML = message;
    input.style.display = passWrapper.style.display = confirmWrapper.style.display = meter.style.display = strengthText.style.display = "none";

    if(type==="text"){
      input.style.display="block";
      input.value="";
      input.placeholder="Enter here";
      input.focus();
    }
    else if(type==="password"){
      passWrapper.style.display="block";
      confirmWrapper.style.display="block";
      meter.style.display="block";
      strengthText.style.display="block";
      pass.value = confirm.value = "";
      strengthCheck("", meterBar, strengthText);
      pass.oninput = e=>strengthCheck(e.target.value, meterBar, strengthText);
    }

    bg.style.display="flex";

   btn.onclick = ()=>{
  if(type==="verify"){
    bg.style.display="none";
    resolve("verify");
    return;
  }

  bg.style.display="none";
  if(type==="text") resolve(input.value.trim());
  else if(type==="password") resolve([pass.value.trim(),confirm.value.trim()]);
  else resolve();
};
  });
}

async function checkVerification(){

  const user = auth.currentUser;

  if(!user){
    showModal("Session expired. Please signup again.");
    return false;
  }

  await user.reload();

  if(!user.emailVerified){
    showModal("Verify your email first");
    return false;
  }

  return true;
}

/* 🔐 MANUAL SIGNUP */
signupForm.onsubmit = async e => {
  e.preventDefault();

  const passVal = password.value.trim();
  if (!strengthCheck(passVal, meterBar, strengthText))
    return showModal("Password too weak");

  if (passVal !== confirmPassword.value.trim())
    return showModal("Passwords do not match");

  try {

    const cred = await auth.createUserWithEmailAndPassword(
      email.value.trim(),
      passVal
    );

    const user = cred.user;

    const username = fullName.value.trim();

    // ✅ Update display name
    await user.updateProfile({
      displayName: username
    });

    // ✅ SAVE USERNAME IMMEDIATELY (CRITICAL FIX)
    await db.collection("users").doc(user.uid).set({
      uid: user.uid,
      email: user.email,
      username: username,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("usernames").doc(username).set({
      uid: user.uid
    });

    // ✅ Send verification
    await user.sendEmailVerification({
      url: window.location.origin + "/index.html"
    });

    const action = await showModal(
      "Verification email sent. Click the link in Gmail, then press Continue.",
      "verify"
    );

    if (action === "verify") {

      await user.reload();

      if (!user.emailVerified) {
        return showModal("Email not verified yet.");
      }

      window.location.href = "index.html";
    }

  } catch (err) {
    showModal(err.message);
  }
};

/* 🔁 RESEND BUTTON */
resendBtn.onclick=()=>{
  if(resendCount>=3) return;
  auth.currentUser.sendEmailVerification();
  resendCount++;
  if(resendCount===3){
    resendBtn.disabled=true;
    resendBtn.style.background="#ccc";
    resendBtn.textContent="Resend disabled";
    return;
  }
  startTimer();
};

/* 🔒 GOOGLE SIGNUP → USERNAME + PASSWORD FLOW */
document.getElementById("googleSignup").onclick=()=>{
  auth.signInWithPopup(provider).then(async result=>{
    const user = result.user;
    const isNewUser = user.metadata.creationTime === user.metadata.lastSignInTime;
    if(!isNewUser){
      showModal("This Google account is already registered. Please login instead.","info");
      auth.signOut();
      return;
    }

    await user.sendEmailVerification({ url: window.location.origin + "/signup.html" });
    localStorage.setItem("verifyPending","true");
localStorage.setItem("verifyMethod","google");
localStorage.setItem("verifyEmail",user.email);
    const action = await showModal(
  "Verification email sent. Click Continue in Gmail",
  "verify"
);

if(action==="verify"){
  if(await checkVerification()){
    window.location.reload();
  }
}
  }).catch(err=>showModal(err.message));
};

/* 🔁 CHECK VERIFICATION WHEN PAGE OPENS */
window.addEventListener("load", async () => {
  const pending = localStorage.getItem("verifyPending");
  if (!pending) return;

  const user = auth.currentUser;

  if (!user) return;

  await user.reload();

  if (user.emailVerified) {
    // Trigger auth state manually
    auth.onAuthStateChanged(() => {});
  }
});

/* 🔄 REDIRECT AFTER VERIFICATION */
auth.onAuthStateChanged(async user => {
  if (!user) return;/* 🔥 AUTO CONTINUE AFTER EMAIL VERIFICATION LINK */
window.addEventListener("load", async () => {

  const pending = localStorage.getItem("verifyPending");
  if (!pending) return;

  auth.onAuthStateChanged(async user => {

    if (!user) return;

    await user.reload();

    if (!user.emailVerified) return;

    const method = localStorage.getItem("verifyMethod");

    /* ================= MANUAL SIGNUP ================= */
    if (method === "manual") {
      window.location.reload();
      return;
    }

    /* ================= GOOGLE SIGNUP ================= */
    if (method === "google") {
      sessionStorage.setItem("googleAwait","true");
      window.location.reload();
      return;
    }

  });

});

  await user.reload();

  const pending = localStorage.getItem("verifyPending");
  const method = localStorage.getItem("verifyMethod");

  if (!pending) return;

/* ================= MANUAL SIGNUP AUTO FINISH ================= */
if (method === "manual" && user.emailVerified) {

    localStorage.removeItem("verifyPending");
    localStorage.removeItem("verifyMethod");
    localStorage.removeItem("verifyEmail");

    let username = user.displayName || user.email.split("@")[0];

    await db.collection("users").doc(user.uid).set({
      uid: user.uid,
      email: user.email,
      username: username,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("usernames").doc(username).set({
      uid: user.uid
    });

    window.location.href = "index.html";
    return;
  }

  /* ================= GOOGLE SIGNUP CONTINUE ================= */
  if (method === "google") {

    if(!user.emailVerified){
      showModal("Please verify your email first");
      return;
    }

    localStorage.removeItem("verifyPending");
    localStorage.removeItem("verifyMethod");
    localStorage.removeItem("verifyEmail");

    let username = await showModal("Choose a username", "text");
    if (!username) return showModal("Username is required");

    const [pass, confirm] = await showModal("Set a password", "password");
    if (pass !== confirm) return showModal("Passwords do not match");

    const credential = firebase.auth.EmailAuthProvider.credential(user.email, pass);
    await user.linkWithCredential(credential);

    await user.updateProfile({ displayName: username });

    await db.collection("users").doc(user.uid).set({
      uid: user.uid,
      email: user.email,
      username: username,
      provider: "google",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("usernames").doc(username).set({
      uid: user.uid
    });

    window.location.href = "index.html";
  }

  /* 🔹 GOOGLE SIGNUP HANDLER ⬇️ ADD HERE */
  if (sessionStorage.getItem("googleAwait") === "true") {
    sessionStorage.removeItem("googleAwait");

    let username = await showModal("Choose a username", "text");
    if (!username) return showModal("Username is required");

    const [pass, confirm] = await showModal("Set a password", "password");
    if (pass !== confirm) return showModal("Passwords do not match");

    const credential = firebase.auth.EmailAuthProvider.credential(
      user.email,
      pass
    );
    await user.linkWithCredential(credential);

    await user.updateProfile({ displayName: username });

    await db.collection("users").doc(user.uid).set({
      uid: user.uid,
      email: user.email,
      username: username,
      provider: "google",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("usernames").doc(username).set({
      uid: user.uid
    });

    window.location.href = "index.html";
    return;
  }
});

</script>

</body>
</html>
